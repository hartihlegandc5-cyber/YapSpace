publish_to: "none"
version: 1.0.0+10
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  record: ^6.1.1
  just_audio: ^0.9.42
flutter:
